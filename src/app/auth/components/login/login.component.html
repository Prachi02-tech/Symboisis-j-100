

<br>
<br>
<br><div class="login-container">
    <div class="login-card">
      <br>
      <h2>Login</h2>
      <form nz-form [formGroup]="loginForm" (ngSubmit)="onSubmit()"> <!-- Bind to the form group here -->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required formControlName="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required formControlName="password">
        </div>
        <button type="submit" class="login-btn">Login</button>
        <div class="register-link">
          <p>Don't have an account? <a href="/register" routerLink="/register" routerLinkActive="active">Sign Up</a></p>
        </div>
      </form>
    </div>
  </div>
