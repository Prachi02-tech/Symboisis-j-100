<br>
<br><div class="center-container">
  <h1>Welcome To Car Rental System</h1>
</div>
<br>
<br>
<br><div class="signup-container">
    <div class="signup-card">
      <h2>Sign Up</h2>
      <form nz-form [formGroup]="signupForm" (ngSubmit)="onSubmit()"> <!-- Bind to the form group here -->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" formControlName="email" required>
          <div *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
            <small class="text-danger" *ngIf="signupForm.get('email')?.hasError('required')">Email is required.</small>
            <small class="text-danger" *ngIf="signupForm.get('email')?.hasError('email')">Please enter a valid email.</small>
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" formControlName="password" required>
          <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
            <small class="text-danger" *ngIf="signupForm.get('password')?.hasError('required')">Password is required.</small>
            <small class="text-danger" *ngIf="signupForm.get('password')?.hasError('minlength')">Password must be at least 6 characters.</small>
          </div>
        </div>
  
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" formControlName="confirmPassword" required>
          <div *ngIf="signupForm.get('confirmPassword')?.invalid && signupForm.get('confirmPassword')?.touched">
            <small class="text-danger" *ngIf="signupForm.get('confirmPassword')?.hasError('required')">Confirm password is required.</small>
            <small class="text-danger" *ngIf="signupForm.hasError('mismatch')">Passwords must match.</small>
          </div>
        </div>
  
        <button type="submit" class="signup-btn">Sign Up</button>
  
        <div class="login-link">
          <p>Already have an account? <a href="/login" routerLink="/login" routerLinkActive="active">Log In</a></p>
        </div>
      </form>
    </div>
